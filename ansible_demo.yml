---
### TARGET SECTION ###
- hosts: all
  become: true
  become_method: sudo

### VARIABLE SECTION ###
  vars:
    package1: "httpd"
    package2: "git"
    source: "/home/ubuntu/index.html"
    destination: "/var/www/html"
  tasks:
  - name: 1. Installing {{package1}}
    yum: name={{package1}} state=latest
  - name: 2. Installing {{package2}}
    yum: name={{package2}} state=latest
  - name: copy {{source}} to {{destination}}
    copy: src={{source}} dest={{destination}}
    notify: start_apache_service
  handlers:
  - name: start_apache_service
    service: name={{package1}} state=restarted
